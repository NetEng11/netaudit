! Configuración ficticia de ejemplo (IPs de documentación RFC 5737)
hostname sw-core-01
!
service password-encryption
enable secret 9 $9$EXAMPLEHASHNOTREAL
!
ip ssh version 2
!
ntp server 192.0.2.10
ntp server 192.0.2.11
logging host 192.0.2.50
!
banner motd ^CAcceso restringido a personal autorizado^C
!
interface GigabitEthernet0/1
 description Troncal hacia sw-access-02
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
!
interface GigabitEthernet0/2
 description Troncal hacia rtr-edge-01
 switchport mode trunk
 switchport trunk allowed vlan 10,20
!
interface GigabitEthernet0/3
 description Servidor de monitorización
 switchport mode access
 switchport access vlan 30
!
snmp-server community Xk93-demo-ro RO
!
line vty 0 15
 transport input ssh
!
